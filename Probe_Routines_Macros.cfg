#####################################################################
# Eddy Probe Mesh Macros (probe_eddy_current.py)
# - Auto-clamps to [bed_mesh] mesh_min/mesh_max if present
# - Falls back to toolhead axis_minimum/axis_maximum otherwise
# - Includes Adaptive Mesh (rapid_scan) for OrcaSlicer compatibility
#
# OrcaSlicer notes (important for Adaptive Mesh):
#   1) Enable "Label Objects" / "Exclude Objects" in OrcaSlicer:
#      - OrcaSlicer -> Printer Settings -> Advanced / Others (wording varies by version)
#      - Turn on "Exclude objects" (so EXCLUDE_OBJECT_DEFINE is emitted)
#   2) Enable "Adaptive Bed Mesh" in OrcaSlicer (if available):
#      - OrcaSlicer -> Printer Settings -> Bed -> Adaptive bed mesh
#      - Set a sensible margin (e.g. 10mm)
#   3) Start G-code recommendation (Orca):
#      - Call the macro AFTER homing and BEFORE printing:
#          EDDY_MESH_ADAPTIVE PROFILE=eddy_adapt MARGIN=10 SAMPLE_TIME=0.08
#      - If Orca does NOT automatically emit EXCLUDE_OBJECT_DEFINE lines,
#        Adaptive mesh cannot know the object footprint. Enable Exclude Objects.
#####################################################################

[gcode_macro _EDDY_VARS]
description: Internal defaults for eddy macros (mesh + sampling)
variable_chip: "eddy"
variable_zhop: 5.0
variable_xy_f: 6000
variable_z_f: 300
variable_sample_time_fast: 0.08
variable_sample_time_slow: 0.12
variable_default_margin: 10.0
gcode:
  ; intentionally empty


#####################################################################
# Helpers: Determine clamped bounds
#####################################################################

[gcode_macro _EDDY_GET_BOUNDS]
description: Internal: choose mesh bounds from [bed_mesh] if available else axis bounds
gcode:
  {% set xmin = printer.toolhead.axis_minimum.x|float %}
  {% set xmax = printer.toolhead.axis_maximum.x|float %}
  {% set ymin = printer.toolhead.axis_minimum.y|float %}
  {% set ymax = printer.toolhead.axis_maximum.y|float %}

  # Try to pull mesh_min/mesh_max from config if present.
  # NOTE: Klipper exposes config via printer.configfile.settings on most setups.
  {% set bm = printer.configfile.settings.bed_mesh if printer.configfile is defined and printer.configfile.settings is defined and printer.configfile.settings.bed_mesh is defined else None %}

  {% if bm and bm.mesh_min is defined and bm.mesh_max is defined %}
    {% set mmin = bm.mesh_min|string %}
    {% set mmax = bm.mesh_max|string %}
    {% set mxmin = (mmin.split(',')[0])|float %}
    {% set mymin = (mmin.split(',')[1])|float %}
    {% set mxmax = (mmax.split(',')[0])|float %}
    {% set mymax = (mmax.split(',')[1])|float %}

    ; Mesh bounds from [bed_mesh]
    SET_GCODE_VARIABLE MACRO=_EDDY_BOUNDS VARIABLE=xmin VALUE={mxmin}
    SET_GCODE_VARIABLE MACRO=_EDDY_BOUNDS VARIABLE=xmax VALUE={mxmax}
    SET_GCODE_VARIABLE MACRO=_EDDY_BOUNDS VARIABLE=ymin VALUE={mymin}
    SET_GCODE_VARIABLE MACRO=_EDDY_BOUNDS VARIABLE=ymax VALUE={mymax}
  {% else %}
    ; Fallback to full axis bounds
    SET_GCODE_VARIABLE MACRO=_EDDY_BOUNDS VARIABLE=xmin VALUE={xmin}
    SET_GCODE_VARIABLE MACRO=_EDDY_BOUNDS VARIABLE=xmax VALUE={xmax}
    SET_GCODE_VARIABLE MACRO=_EDDY_BOUNDS VARIABLE=ymin VALUE={ymin}
    SET_GCODE_VARIABLE MACRO=_EDDY_BOUNDS VARIABLE=ymax VALUE={ymax}
  {% endif %}


[gcode_macro _EDDY_BOUNDS]
description: Internal storage for bounds chosen by _EDDY_GET_BOUNDS
variable_xmin: 0.0
variable_xmax: 0.0
variable_ymin: 0.0
variable_ymax: 0.0
gcode:
  ; intentionally empty


[gcode_macro _EDDY_CENTER_FROM_BOUNDS]
description: Internal: returns center X/Y from selected bounds
gcode:
  _EDDY_GET_BOUNDS
  {% set b = printer["gcode_macro _EDDY_BOUNDS"] %}
  {% set cx = (b.xmin|float + b.xmax|float) / 2.0 %}
  {% set cy = (b.ymin|float + b.ymax|float) / 2.0 %}
  {action_respond_info("EDDY bounds: X[%.2f..%.2f] Y[%.2f..%.2f] center=(%.2f, %.2f)" %
    (b.xmin, b.xmax, b.ymin, b.ymax, cx, cy))}


[gcode_macro EDDY_SAFE_PREP_CLAMPED]
description: Z-hop, home (optional), move to clamped center or given X/Y within bounds. Params: HOME=1 X=.. Y=..
gcode:
  {% set v = printer["gcode_macro _EDDY_VARS"] %}
  {% set home = params.HOME|default(1)|int %}

  _EDDY_GET_BOUNDS
  {% set b = printer["gcode_macro _EDDY_BOUNDS"] %}
  {% set cx = (b.xmin|float + b.xmax|float) / 2.0 %}
  {% set cy = (b.ymin|float + b.ymax|float) / 2.0 %}

  {% set x = params.X|default(cx)|float %}
  {% set y = params.Y|default(cy)|float %}

  ; clamp
  {% if x < b.xmin|float %}{% set x = b.xmin|float %}{% endif %}
  {% if x > b.xmax|float %}{% set x = b.xmax|float %}{% endif %}
  {% if y < b.ymin|float %}{% set y = b.ymin|float %}{% endif %}
  {% if y > b.ymax|float %}{% set y = b.ymax|float %}{% endif %}

  ; Z-hop first
  G91
  G1 Z{v.zhop} F{v.z_f}
  G90

  {% if home == 1 %}
    {% if printer.toolhead.homed_axes != "xyz" %}
      G28
    {% endif %}
  {% endif %}

  G1 X{x} Y{y} F{v.xy_f}


#####################################################################
# Auto-clamped mesh wrappers
#####################################################################

[gcode_macro EDDY_MESH_FAST_CLAMPED]
description: Fast full mesh, clamped to [bed_mesh] bounds, using rapid_scan. Params: PROFILE=.. SAMPLE_TIME=..
gcode:
  {% set v = printer["gcode_macro _EDDY_VARS"] %}
  {% set profile = params.PROFILE|default("eddy_fast") %}
  {% set st = params.SAMPLE_TIME|default(v.sample_time_fast)|float %}

  _EDDY_GET_BOUNDS
  {% set b = printer["gcode_macro _EDDY_BOUNDS"] %}

  EDDY_SAFE_PREP_CLAMPED HOME=1
  BED_MESH_CLEAR

  ; Force mesh area explicitly to the clamped bounds
  BED_MESH_CALIBRATE METHOD=rapid_scan SAMPLE_TIME={st} MESH_MIN={b.xmin},{b.ymin} MESH_MAX={b.xmax},{b.ymax}

  BED_MESH_PROFILE SAVE={profile}
  {action_respond_info("Saved mesh profile '%s' using rapid_scan, SAMPLE_TIME=%.3f within bounds X[%.2f..%.2f] Y[%.2f..%.2f]" %
    (profile, st, b.xmin, b.xmax, b.ymin, b.ymax))}


[gcode_macro EDDY_MESH_ACCURATE_CLAMPED]
description: Slower full mesh, clamped to [bed_mesh] bounds, using scan. Params: PROFILE=.. SAMPLE_TIME=..
gcode:
  {% set v = printer["gcode_macro _EDDY_VARS"] %}
  {% set profile = params.PROFILE|default("eddy_scan") %}
  {% set st = params.SAMPLE_TIME|default(v.sample_time_slow)|float %}

  _EDDY_GET_BOUNDS
  {% set b = printer["gcode_macro _EDDY_BOUNDS"] %}

  EDDY_SAFE_PREP_CLAMPED HOME=1
  BED_MESH_CLEAR

  BED_MESH_CALIBRATE METHOD=scan SAMPLE_TIME={st} MESH_MIN={b.xmin},{b.ymin} MESH_MAX={b.xmax},{b.ymax}

  BED_MESH_PROFILE SAVE={profile}
  {action_respond_info("Saved mesh profile '%s' using scan, SAMPLE_TIME=%.3f within bounds X[%.2f..%.2f] Y[%.2f..%.2f]" %
    (profile, st, b.xmin, b.xmax, b.ymin, b.ymax))}


#####################################################################
# Adaptive mesh (OrcaSlicer compatible) using rapid_scan
#####################################################################

[gcode_macro EDDY_MESH_ADAPTIVE]
description: Adaptive mesh (rapid_scan). Requires EXCLUDE_OBJECT_DEFINE from slicer. Params: PROFILE=.. MARGIN=.. SAMPLE_TIME=..
gcode:
  {% set v = printer["gcode_macro _EDDY_VARS"] %}
  {% set profile = params.PROFILE|default("eddy_adapt") %}
  {% set margin = params.MARGIN|default(v.default_margin)|float %}
  {% set st = params.SAMPLE_TIME|default(v.sample_time_fast)|float %}

  EDDY_SAFE_PREP_CLAMPED HOME=1
  BED_MESH_CLEAR

  # Klipper Adaptive Mesh uses the currently defined objects (Exclude Objects feature).
  # OrcaSlicer should emit EXCLUDE_OBJECT_DEFINE commands in the gcode when enabled.
  #
  # We still use rapid_scan for speed.
  BED_MESH_CALIBRATE METHOD=rapid_scan SAMPLE_TIME={st} ADAPTIVE=1 ADAPTIVE_MARGIN={margin}

  BED_MESH_PROFILE SAVE={profile}
  {action_respond_info("Saved adaptive mesh profile '%s' (rapid_scan, SAMPLE_TIME=%.3f, margin=%.1f). Make sure Orca emits EXCLUDE_OBJECT_DEFINE." %
    (profile, st, margin))}

#####################################################################
# Adaptive-if-possible, else full clamped mesh (rapid_scan)
#####################################################################

# OrcaSlicer (for Adaptive Mesh via Exclude Objects):
# 1) Enable "Exclude objects" so Orca emits EXCLUDE_OBJECT_DEFINE lines.
# 2) Optional: Enable "Adaptive Bed Mesh" in Orca (if present). Margin ~10mm is typical.
# 3) Call in Start G-code AFTER homing and BEFORE printing:
#    EDDY_MESH_AUTO PROFILE=eddy_auto MARGIN=10 SAMPLE_TIME=0.08

# EDDY_MESH_AUTO

# EDDY_MESH_AUTO PROFILE=eddy_auto MARGIN=12 SAMPLE_TIME=0.08

[gcode_macro EDDY_MESH_AUTO]
description: Auto mesh: adaptive if objects defined, else full clamped mesh. Params: PROFILE=.. MARGIN=.. SAMPLE_TIME=..
gcode:
  {% set v = printer["gcode_macro _EDDY_VARS"] %}
  {% set profile = params.PROFILE|default("eddy_auto") %}
  {% set margin = params.MARGIN|default(v.default_margin)|float %}
  {% set st = params.SAMPLE_TIME|default(v.sample_time_fast)|float %}

  EDDY_SAFE_PREP_CLAMPED HOME=1
  BED_MESH_CLEAR

  # Determine if Exclude Objects has defined any objects.
  # If OrcaSlicer has "Exclude objects" enabled, it will emit EXCLUDE_OBJECT_DEFINE lines.
  # Klipper then populates printer.exclude_object.objects
  {% set have_exclude = printer.exclude_object is defined %}
  {% set obj_count = (printer.exclude_object.objects|length) if have_exclude and (printer.exclude_object.objects is defined) else 0 %}

  {% if obj_count > 0 %}
    {action_respond_info("EDDY_MESH_AUTO: Using ADAPTIVE mesh (objects defined: %d), margin=%.1f" % (obj_count, margin))}
    BED_MESH_CALIBRATE METHOD=rapid_scan SAMPLE_TIME={st} ADAPTIVE=1 ADAPTIVE_MARGIN={margin}
  {% else %}
    _EDDY_GET_BOUNDS
    {% set b = printer["gcode_macro _EDDY_BOUNDS"] %}
    {action_respond_info("EDDY_MESH_AUTO: No objects defined, using FULL CLAMPED mesh within X[%.2f..%.2f] Y[%.2f..%.2f]" %
      (b.xmin, b.xmax, b.ymin, b.ymax))}
    BED_MESH_CALIBRATE METHOD=rapid_scan SAMPLE_TIME={st} MESH_MIN={b.xmin},{b.ymin} MESH_MAX={b.xmax},{b.ymax}
  {% endif %}

  BED_MESH_PROFILE SAVE={profile}
  {action_respond_info("EDDY_MESH_AUTO: Saved mesh profile '%s' (rapid_scan, SAMPLE_TIME=%.3f)" % (profile, st))}

